# CI baseline for https://github.com/xhon4/oxsh/issues/27
#
# What this workflow claims, and what it does not:
# - Linux (ubuntu-latest): build, test, and Clippy are required. The test
#   suite has also been run locally in bubblewrap, and on GitHub Actions
#   (run 45323378507, rustc 1.100.0 / 1.88.0).
# - macOS: compile-only (`cargo check`). Verified on GitHub Actions
#   (run 45323378507, macos-26-arm64, rustc 1.100.0). Functional tests
#   are not run and are not claimed.
# - rustfmt is omitted from this workflow. main has 67 preexisting hunks
#   in 14 files; a non-blocking or "always green" rustfmt job would not
#   distinguish that drift from new drift. A dedicated formatting PR will
#   format the tree and add rustfmt --check as a required job. That PR
#   should land after the #10 parser redesign (PR-A) so it does not
#   collide with open parser work. See the #31 PR body.
# - Windows is omitted from this workflow. main does not compile (#30:
#   `unix_setup` is still type-checked under `cfg!(windows)` in
#   src/setup.rs). A job allowed to fail on any error would hide new
#   compile breaks. The Windows compile job will be added, required, in
#   the PR that fixes #30.
# - PTY tests (tests/interactive_signals.rs) are `cfg(target_os = "linux")`.
#   They open their own PTY via posix_openpt; they do not need the runner's
#   stdin to be a TTY. They passed locally inside bubblewrap with /dev/ptmx,
#   and in the Linux test jobs of run 45323378507.
#
# Actions are official: actions/checkout@v7, dtolnay/rust-toolchain@stable
# and @1.88.0 (the @rev selects the toolchain; see the action README).
# Permissions are contents: read only. No paid services; this repository
# is public, so GitHub-hosted runners are free.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Linux tests (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked

  msrv:
    name: Linux MSRV 1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test on the verified MSRV
        run: cargo test --locked

  clippy:
    name: Linux Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # -D warnings is used because `cargo clippy --locked --all-targets -- -D warnings`
      # is clean on main (50b0428) with rustc 1.100.0, aside from the preexisting
      # cargo manifest warning `package.homepage` (not a rustc/clippy lint).
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  compile-macos:
    name: macOS compile only (not functionally tested)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --locked --all-targets
